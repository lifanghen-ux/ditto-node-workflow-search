name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DITTO_PROVIDER_PYTHON: python
      MATH_SCORER_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-scoring.txt
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: npm run check
