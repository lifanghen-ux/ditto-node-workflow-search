name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-local.txt
      - run: npm ci
      - run: npm run check
        env:
          DITTO_PROVIDER_PYTHON: python
      - run: npm run test:generated
      - run: python scripts/provider_bridge_test.py
